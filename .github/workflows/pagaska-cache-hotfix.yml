name: Pagaska cache hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch cache write gate
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt")
          text = path.read_text()

          if "import androidx.media3.datasource.DataSink" not in text:
              text = text.replace(
                  "import androidx.media3.datasource.DataSource\n",
                  "import androidx.media3.datasource.DataSink\nimport androidx.media3.datasource.DataSource\nimport androidx.media3.datasource.DataSpec\n",
                  1,
              )
          if "import androidx.media3.datasource.cache.CacheDataSink" not in text:
              text = text.replace(
                  "import androidx.media3.datasource.cache.CacheDataSource\n",
                  "import androidx.media3.datasource.cache.CacheDataSink\nimport androidx.media3.datasource.cache.CacheDataSource\n",
                  1,
              )

          old = """.setCache(playerCache)
                    .setUpstreamDataSourceFactory("""
          new = """.setCache(playerCache)
                    .setCacheWriteDataSinkFactory(
                        object : DataSink.Factory {
                            override fun createDataSink(): DataSink {
                                return if (dataStore.get(EnableSongCacheKey, true)) {
                                    CacheDataSink.Factory()
                                        .setCache(playerCache)
                                        .createDataSink()
                                } else {
                                    object : DataSink {
                                        override fun open(dataSpec: DataSpec) = Unit
                                        override fun write(buffer: ByteArray, offset: Int, length: Int) = Unit
                                        override fun close() = Unit
                                    }
                                }
                            }
                        },
                    )
                    .setUpstreamDataSourceFactory("""

          if old not in text:
              if "setCacheWriteDataSinkFactory(" in text:
                  raise SystemExit("cache sink patch is already present but not in expected form")
              raise SystemExit("expected inner player cache configuration not found")

          path.write_text(text.replace(old, new, 1))

      - name: Compile check
        run: ./gradlew :app:compileFossDebugKotlin --no-daemon

      - name: Commit and remove hotfix workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt .github/workflows/pagaska-cache-hotfix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(cache): gate player writes when cache is off"
          git rm .github/workflows/pagaska-cache-hotfix.yml
          git commit -m "chore: remove temporary cache hotfix workflow"
          git push
