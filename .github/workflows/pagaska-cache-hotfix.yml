name: Pagaska cache hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Patch cache write gate
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt")
          text = path.read_text()

          start = text.index("    private fun createCacheDataSource(): CacheDataSource.Factory")
          end = text.index("\n    private var isSilenceSkipping", start)

          replacement = '''    private fun createCacheDataSource(): CacheDataSource.Factory {
        val playerCacheDataSource =
            CacheDataSource.Factory()
                .setCache(playerCache)
                .setUpstreamDataSourceFactory(
                    DefaultDataSource.Factory(
                        this,
                        OkHttpDataSource.Factory(
                            OkHttpClient
                                .Builder()
                                .proxy(YouTube.proxy)
                                .proxyAuthenticator { _, response ->
                                    YouTube.proxyAuth?.let { auth ->
                                        response.request
                                            .newBuilder()
                                            .header("Proxy-Authorization", auth)
                                            .build()
                                    } ?: response.request
                                }.build(),
                        ),
                    ),
                )

        if (!dataStore.get(EnableSongCacheKey, true)) {
            playerCacheDataSource.setCacheWriteDataSinkFactory(null)
        }

        return CacheDataSource.Factory()
            .setCache(downloadCache)
            .setUpstreamDataSourceFactory(playerCacheDataSource)
            .setCacheWriteDataSinkFactory(null)
            .setFlags(FLAG_IGNORE_CACHE_ON_ERROR)
    }
'''

          text = text[:start] + replacement + text[end:]
          path.write_text(text)

      - name: Compile check
        run: ./gradlew :app:compileFossDebugKotlin --no-daemon

      - name: Commit and remove hotfix workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt .github/workflows/pagaska-cache-hotfix.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(cache): gate player writes when cache is off"
          git rm .github/workflows/pagaska-cache-hotfix.yml
          git commit -m "chore: remove temporary cache hotfix workflow"
          git push
