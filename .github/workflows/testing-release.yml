name: Testing Release

on:
  push:
    branches:
      - 'audio/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g

jobs:
  build-testing:
    name: Build Testing APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Verify protobuf source
        shell: bash
        run: |
          set -euo pipefail
          test -f metroproto/listentogether.proto
          echo "Found metroproto/listentogether.proto"
          git submodule status --recursive

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Prepare debug keystore
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair \
              -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f "$HOME/.android/debug.keystore"
          echo "PAGASKA_DEBUG_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "PAGASKA_DEBUG_KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
          echo "PAGASKA_DEBUG_KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
          echo "PAGASKA_DEBUG_KEY_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build testing APK
        run: ./gradlew :app:assembleFossDebug --stacktrace

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          ls -lah app/build/outputs/apk/foss/debug/
          test -n "$(find app/build/outputs/apk/foss/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"

      - name: Upload testing APK
        uses: actions/upload-artifact@v4
        with:
          name: pagaska-music-testing-${{ github.run_number }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
