name: Apply cache read-only toggle fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_apply_cache_readonly_fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch MusicService.kt
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt')
          text = path.read_text()

          old_factory = '''        val playerCacheFactory =
            CacheDataSource
                .Factory()
                .setCache(playerCache)
                .setUpstreamDataSourceFactory(upstreamFactory)
                .setFlags(FLAG_IGNORE_CACHE_ON_ERROR)

        val switchingFactory =
            DataSource.Factory {
                CacheSwitchDataSource(playerCacheFactory, upstreamFactory)
            }
'''

          new_factory = '''        val playerCacheFactory =
            CacheDataSource
                .Factory()
                .setCache(playerCache)
                .setUpstreamDataSourceFactory(upstreamFactory)
                .setFlags(FLAG_IGNORE_CACHE_ON_ERROR)

        // Keep the player cache readable while the setting is disabled, but prevent
        // new streaming data from being written into it.
        val playerCacheReadOnlyFactory =
            CacheDataSource
                .Factory()
                .setCache(playerCache)
                .setUpstreamDataSourceFactory(upstreamFactory)
                .setCacheWriteDataSinkFactory(null)
                .setFlags(FLAG_IGNORE_CACHE_ON_ERROR)

        val switchingFactory =
            DataSource.Factory {
                CacheSwitchDataSource(playerCacheFactory, playerCacheReadOnlyFactory)
            }
'''

          if old_factory not in text:
              raise SystemExit('Target factory block not found; aborting without changes.')
          text = text.replace(old_factory, new_factory, 1)

          old_doc = '''     * `CacheDataSource.Factory.setCacheWriteDataSinkFactory(null)` is what makes a layer read-only
     * in media3 (the factory sets `cacheIsReadOnly = writeSinkFactory == null`). Only the
     * downloadCache layer uses it: the playerCache layer exists precisely to write streamed audio,
     * so gating it has to happen by choosing whether that layer is used at all.
'''
          new_doc = '''     * `CacheDataSource.Factory.setCacheWriteDataSinkFactory(null)` makes a cache layer read-only
     * in media3. The playerCache layer therefore has two modes: normal read/write and read-only.
     * Disabling the setting must not bypass playerCache, because existing streamed cache and
     * protected Offline Cache still need to be readable.
'''
          if old_doc in text:
              text = text.replace(old_doc, new_doc, 1)

          old_switch_doc = '''     * Picks between the cache-backed data source and a direct (no-cache) one at `open()` time.
     *
     * ExoPlayer keeps a [DataSource] instance alive across many open()/close() cycles, so the
     * decision is re-evaluated on every open: turning the song cache off stops both writes *and*
     * reads of `files/exoplayer` from the next chunk onwards, and turning it back on resumes
     * caching immediately — no player rebuild, no restart, no interruption.
'''
          new_switch_doc = '''     * Picks between the normal read/write cache source and the read-only cache source at `open()` time.
     *
     * ExoPlayer keeps a [DataSource] instance alive across many open()/close() cycles, so the
     * decision is re-evaluated on every open: turning the song cache off stops new writes while
     * preserving reads from `files/exoplayer`, and turning it back on resumes caching immediately.
'''
          if old_switch_doc in text:
              text = text.replace(old_switch_doc, new_switch_doc, 1)

          path.write_text(text)
          PY

      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          git commit -m 'fix: keep player cache readable when song cache is disabled'
          git push origin main
