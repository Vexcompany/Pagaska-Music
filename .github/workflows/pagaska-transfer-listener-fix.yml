name: Pagaska TransferListener Fix

on:
  push:
    paths:
      - .github/workflows/pagaska-transfer-listener-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch CacheSwitchDataSource
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt")
          text = path.read_text(encoding="utf-8")

          if "androidx.media3.datasource.TransferListener" not in text:
              text = text.replace(
                  "import androidx.media3.datasource.DataSpec\n",
                  "import androidx.media3.datasource.DataSpec\nimport androidx.media3.datasource.TransferListener\n",
                  1,
              )

          old = '''        private var active: DataSource? = null\n\n        override fun open(dataSpec: DataSpec): Long {\n            val next = (if (songCacheEnabled) cachedFactory else directFactory).createDataSource()\n            val previous = active\n            active = next\n            if (previous != null && previous !== next) {\n                runCatching { previous.close() }\n            }\n            return next.open(dataSpec)\n        }\n'''

          new = '''        private var active: DataSource? = null\n        private val transferListeners = mutableListOf<TransferListener>()\n\n        override fun addTransferListener(transferListener: TransferListener) {\n            transferListeners += transferListener\n        }\n\n        override fun open(dataSpec: DataSpec): Long {\n            val next = (if (songCacheEnabled) cachedFactory else directFactory).createDataSource()\n            transferListeners.forEach(next::addTransferListener)\n            val previous = active\n            active = next\n            if (previous != null && previous !== next) {\n                runCatching { previous.close() }\n            }\n            return next.open(dataSpec)\n        }\n'''

          if old not in text:
              raise SystemExit("Expected CacheSwitchDataSource anchor not found; refusing to modify the file")
          if text.count(old) != 1:
              raise SystemExit(f"Expected exactly one CacheSwitchDataSource anchor, found {text.count(old)}")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Verify patch
        shell: bash
        run: |
          grep -n -A18 -B3 'private inner class CacheSwitchDataSource' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'import androidx.media3.datasource.TransferListener' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt
          grep -q 'override fun addTransferListener(transferListener: TransferListener)' app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/kotlin/com/metrolist/music/playback/MusicService.kt .github/workflows/pagaska-transfer-listener-fix.yml
          git commit -m "fix: implement TransferListener in cache switch data source"
          git push
          git rm .github/workflows/pagaska-transfer-listener-fix.yml
          git commit -m "chore: remove temporary transfer listener fix workflow"
          git push
