name: Build Pagaska Music PR

on:
  pull_request:
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: true
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run FOSS Release unit tests
        run: ./gradlew --console=plain :app:testFossReleaseUnitTest --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAGASKA_APPLICATION_ID: com.metrolist.music.pr.p${{ github.event.number }}
          PAGASKA_APP_NAME: Pagaska Music PR ${{ github.event.number }}
          PULL_REQUEST: "true"

      - name: Build and Lint FOSS Release APK
        run: ./gradlew --console=plain assembleFossRelease :app:lintFossRelease --warning-mode summary
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PAGASKA_APPLICATION_ID: com.metrolist.music.pr.p${{ github.event.number }}
          PAGASKA_APP_NAME: Pagaska Music PR ${{ github.event.number }}
          PULL_REQUEST: "true"
