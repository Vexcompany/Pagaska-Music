name: Pagaska Build APK

on:
  workflow_dispatch:
  push:
    branches: ["main", "pagaska-branding"]

permissions:
  contents: read

jobs:
  build-foss-debug:
    name: Build Foss Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Android debug keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v \
              -keystore ~/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Generate fallback persistent debug keystore
        run: |
          if [ ! -f app/persistent-debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore app/persistent-debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build FOSS Debug APK
        run: ./gradlew --console=plain :app:assembleFossDebug
        env:
          METROLIST_APPLICATION_ID: id.pagaska.music
          METROLIST_APP_NAME: Pagaska Music
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: pagaska-foss-debug-apk
          path: app/build/outputs/apk/foss/debug/*.apk
